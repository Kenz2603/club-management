<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hồ sơ · Club Management</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/workspace.css">
  <link rel="stylesheet" href="css/design.css">
</head>
<body data-page="profile">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính">
      <div class="sidebar-brand">
        <a href="dashboard.html" class="brand"><span class="brand-mark" data-icon="layers"></span>Club Management</a>
      </div>
      <nav id="navigation" class="sidebar-nav" aria-label="Menu"></nav>
      <div class="sidebar-foot">
        <a href="index.html" data-icon="home">Trang công khai</a>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>
    <div class="app-main">
      <header class="topbar">
        <button type="button" id="menu-toggle" class="icon-btn menu-toggle" aria-label="Mở menu điều hướng" aria-controls="sidebar" aria-expanded="false" data-icon="menu"></button>
        <nav class="breadcrumb" aria-label="Đường dẫn">
          <a class="crumb-home" href="dashboard.html">Trang chủ</a>
          <span class="crumb-home" data-icon="chevronRight"></span>
          <span id="crumb" aria-current="page">Hồ sơ</span>
        </nav>
        <div class="topbar-actions">
          <button type="button" id="theme-toggle" class="icon-btn" aria-label="Đổi giao diện sáng/tối"></button>
          <div class="user-chip" id="identity">
            <span class="avatar" id="avatar" aria-hidden="true"></span>
            <div class="user-meta"><strong id="identity-name">…</strong><span id="identity-role"></span></div>
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="signout" aria-label="Đăng xuất" data-icon="logout"><span class="label">Đăng xuất</span></button>
        </div>
      </header>
      <main class="page" id="main">
        <div class="page-header">
          <div>
            <h1>Hồ sơ</h1>
            <p id="subtitle" class="section-subtitle">Thông tin tài khoản và bảo mật</p>
          </div>
          <button type="button" id="create" class="btn btn-primary hidden" data-icon="plus">Thêm mới</button>
        </div>
        <p id="notice" role="status" aria-live="polite"></p>
        <section id="content" class="card" aria-live="polite">
          <span class="skeleton skeleton-line"></span>
          <span class="skeleton skeleton-line"></span>
          <span class="skeleton skeleton-line" style="width:62%"></span>
        </section>
        <dialog id="editor" aria-labelledby="editor-title">
          <form id="record-form">
            <div class="modal-header">
              <h2 id="editor-title"></h2>
              <button type="button" id="close-editor" class="icon-btn" aria-label="Đóng" data-icon="x"></button>
            </div>
            <div id="fields" class="modal-body"></div>
            <p id="form-error" class="alert alert-danger" role="alert"></p>
            <div class="modal-footer">
              <button type="button" id="cancel-editor" class="btn btn-outline">Đóng</button>
              <button id="save" class="btn btn-primary" type="submit">Lưu</button>
            </div>
          </form>
        </dialog>
      </main>
      <footer class="app-footer">Club Management · Dữ liệu nội bộ</footer>
    </div>
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script src="js/shell.js"></script>
  <script src="js/workspace.js"></script>
</body>
</html>

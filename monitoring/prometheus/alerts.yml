groups:
  - name: club-management
    rules:
      - alert: ClubTargetDown
        expr: up == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Monitoring target is down"}
      - alert: ClubBackendErrors
        expr: sum(rate(club_http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Backend 5xx rate is elevated"}
      - alert: ClubDiskLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.15
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Host disk available is below 15 percent"}

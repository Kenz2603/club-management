global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: [localhost:9090]}]
  - job_name: club-backend
    static_configs: [{targets: [backend:3000]}]
  - job_name: node
    static_configs: [{targets: [node-exporter:9100]}]
  - job_name: containers
    static_configs: [{targets: [cadvisor:8080]}]
  - job_name: mysql
    static_configs: [{targets: [mysql-exporter:9104]}]
  - job_name: nginx
    static_configs: [{targets: [nginx-exporter:9113]}]
